name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PY_DIRS: airflow kafka spark ml quality tests

jobs:
  lint:
    name: Lint (flake8, black, isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8 black isort
      - run: flake8 $PY_DIRS --max-line-length 120 --extend-ignore E501,W503,E203
      - run: black --check $PY_DIRS
      - run: isort --check-only $PY_DIRS

  tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest pytest-cov pyyaml numpy pandas holidays requests
      - run: pytest tests --cov=kafka --cov=ml --cov-report=term-missing

  compose:
    name: Validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  images:
    name: Build image ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [lint, tests]
    strategy:
      matrix:
        image: [kafka, spark, mlflow]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t velib/${{ matrix.image }}:ci ./${{ matrix.image }}
