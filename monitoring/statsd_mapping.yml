# Traduction des métriques StatsD d'Airflow en métriques Prometheus étiquetées par DAG / tâche.
mappings:
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_seconds"
    observer_type: summary
    labels:
      dag_id: "$1"
      state: "success"
  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_seconds"
    observer_type: summary
    labels:
      dag_id: "$1"
      state: "failed"
  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    observer_type: summary
    labels:
      dag_id: "$1"
      task_id: "$2"
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_task_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"
  - match: "airflow.ti_failures"
    name: "airflow_task_failures_total"
  - match: "airflow.ti_successes"
    name: "airflow_task_successes_total"
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"
  - match: "airflow.dag_processing.total_parse_time"
    name: "airflow_dag_processing_total_parse_time_seconds"
  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"
  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"
  - match: "."
    match_type: regex
    action: drop
    name: "dropped"
