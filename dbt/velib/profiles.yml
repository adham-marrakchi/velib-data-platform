velib:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'velib') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'velib_secret_2026') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'velib_dw') }}"
      schema: gold
      threads: 2
      keepalives_idle: 0
      connect_timeout: 10
