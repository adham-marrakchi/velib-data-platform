# =============================================================
# Vélib' Data Platform — stack locale (≈ 7 Go de RAM)
# Démarrage : cp .env.example .env && make up
# =============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: velib/airflow:${IMAGE_TAG:-dev}
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    AIRFLOW_CONN_VELIB_DW: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW_BASE_URL: http://localhost:8080
  volumes: &airflow-volumes
    - ./airflow/dags:/opt/airflow/dags
    - ./spark:/opt/airflow/spark
    - ./quality:/opt/airflow/quality
    - ./great_expectations:/opt/airflow/great_expectations
    - ./dbt:/opt/airflow/dbt
    - ./ml:/opt/airflow/ml
    - airflow_logs:/opt/airflow/logs
    - dbt_target:/opt/airflow/dbt_target
  user: "${AIRFLOW_UID:-50000}:0"
  logging: *default-logging
  networks: [pipeline-network]

services:
  # ============================================================
  # STOCKAGE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=150"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      com.pipeline.component: "postgres"
      com.pipeline.tier: "storage"
    networks: [pipeline-network]

  minio:
    # Build communautaire maintenu de MinIO (les images officielles ne sont plus publiées sur Docker Hub)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.pipeline.component: "minio"
      com.pipeline.tier: "storage"
    networks: [pipeline-network]

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${LAKE_BUCKET} &&
      mc mb --ignore-existing local/$${MLFLOW_BUCKET} &&
      echo 'Buckets MinIO prêts.'"
    env_file: .env
    restart: "no"
    labels:
      com.pipeline.component: "minio-init"
      com.pipeline.tier: "storage"
    networks: [pipeline-network]

  # ============================================================
  # INGESTION : API Vélib' -> Kafka -> Spark Streaming -> bronze
  # ============================================================
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    labels:
      com.pipeline.component: "kafka"
      com.pipeline.tier: "ingestion"
    networks: [pipeline-network]

  velib-producer:
    build: ./kafka
    image: velib/producer:${IMAGE_TAG:-dev}
    container_name: velib-producer
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      com.pipeline.component: "velib-producer"
      com.pipeline.tier: "ingestion"
    networks: [pipeline-network]

  spark-streaming:
    build: ./spark
    image: velib/spark:${IMAGE_TAG:-dev}
    container_name: spark-streaming
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    command: >
      /opt/spark/bin/spark-submit
        --master ${SPARK_STREAMING_MASTER}
        --driver-memory ${SPARK_DRIVER_MEMORY}
        --conf spark.ui.prometheus.enabled=true
        --py-files /opt/spark_jobs/lake_config.py
        /opt/spark_jobs/bronze_stream_job.py
    ports:
      - "4040:4040"
      - "8001:8001"
    volumes:
      - ./spark:/opt/spark_jobs:ro
      - spark_checkpoints:/opt/spark_checkpoints
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4040/api/v1/applications"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.pipeline.component: "spark-streaming"
      com.pipeline.tier: "processing"
    networks: [pipeline-network]

  # Cluster Spark standalone (optionnel) : docker compose --profile spark-cluster up -d
  # puis SPARK_STREAMING_MASTER=spark://spark-master:7077 dans .env
  spark-master:
    image: velib/spark:${IMAGE_TAG:-dev}
    container_name: spark-master
    profiles: ["spark-cluster"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8081:8080"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1G }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      com.pipeline.component: "spark-master"
      com.pipeline.tier: "processing"
    networks: [pipeline-network]

  spark-worker:
    image: velib/spark:${IMAGE_TAG:-dev}
    container_name: spark-worker
    profiles: ["spark-cluster"]
    restart: unless-stopped
    logging: *default-logging
    depends_on: [spark-master]
    env_file: .env
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    volumes:
      - spark_checkpoints:/opt/spark_checkpoints
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2560M }
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[W]orker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.pipeline.component: "spark-worker"
      com.pipeline.tier: "processing"
    networks: [pipeline-network]

  # ============================================================
  # ORCHESTRATION : Airflow 3 (api-server, scheduler, dag-processor)
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow version && echo "Airflow initialisé."
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    labels:
      com.pipeline.component: "airflow-init"
      com.pipeline.tier: "orchestration"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.pipeline.component: "airflow-apiserver"
      com.pipeline.tier: "orchestration"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # LocalExecutor : les tâches (Spark local, dbt, ML) s'exécutent dans ce conteneur
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.pipeline.component: "airflow-scheduler"
      com.pipeline.tier: "orchestration"

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768M }
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    labels:
      com.pipeline.component: "airflow-dag-processor"
      com.pipeline.tier: "orchestration"

  # ============================================================
  # MACHINE LEARNING
  # ============================================================
  mlflow:
    build: ./mlflow
    image: velib/mlflow:${IMAGE_TAG:-dev}
    container_name: mlflow
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      com.pipeline.component: "mlflow"
      com.pipeline.tier: "ml"
    networks: [pipeline-network]

  # ============================================================
  # MONITORING
  # ============================================================
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    container_name: statsd-exporter
    restart: unless-stopped
    logging: *default-logging
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    ports:
      - "9102:9102"
    volumes:
      - ./monitoring/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.pipeline.component: "statsd-exporter"
      com.pipeline.tier: "monitoring"
    networks: [pipeline-network]

# ============================================================
networks:
  pipeline-network:
    driver: bridge
    name: pipeline-network

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  spark_checkpoints:
  airflow_logs:
  dbt_target:
